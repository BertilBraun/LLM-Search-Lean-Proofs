# Template of the loop's periodic miniF2F-valid evaluation (experiments/phase6_evaluator.py): the loop's search
# settings (loop_search.toml); the evaluator fills in the served adapters, its reduced budget (32 expansions) and its
# concurrency (16 searches next to the service's). Version 0 is evaluated too, as the baseline at these settings.

[lean]
pool_size = 40
concurrency = 40

[search]
max_expansions = 64
max_wall_seconds = 600.0
max_depth = 16
tactic_timeout_seconds = 10.0
forbidden_steps = [
    "exact?",
    "apply?",
    "rw?",
    "simp?",
    "simp_all?",
    "dsimp?",
    "aesop?",
    "hint",
    "rw_search",
    "library_search",
]

[expander]
kind = "automation_then_policy"

[automation]
tactics = [
    "decide",
    "omega",
    "intros",
    "constructor",
    "rfl",
    "simp",
    "field_simp",
    "norm_num",
    "linarith",
    "ring_nf",
    "simp_all",
    "nlinarith",
    "aesop",
]
timeout_seconds = 10.0
max_wall_clock_timeouts_per_tactic = 1

# Predicted remaining steps dominate: f = 4 h + depth, the order of h + 0.25 depth.
[priority]
kind = "a_star"
value_weight = 4.0

[policy]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
adapter = "policy"
sample_count = 16
temperature = 0.8
top_p = 1.0
# Thinking mode: thinking = true with max_tokens up to 2048 (and the same thinking_instruction in loop_policy.toml);
# the service then keeps each step's reasoning for training.
max_tokens = 512
thinking = false
few_shot = false

[value]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
adapter = "value"

[value.readout]
eight_or_more_steps = 12.0
dead_steps = 16.0
