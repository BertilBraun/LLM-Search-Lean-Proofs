# Expert-iteration round 0 attribution on miniF2F-valid (experiments/run_search.py), row 4's settings exactly
# (experiments/configs/phase3_astar_v0.toml): the round's new policy (SFT on its proofs, then DPO) with value v1.
# Value v1 has dead labels, so p_dead now moves h; D stays 16 until a sweep says otherwise.

[lean]
# Lean is the bottleneck: run under deployment/background.sh with BACKGROUND_CPUS=40 (deployment/README.md).
pool_size = 120
concurrency = 120

[search]
max_expansions = 64
max_wall_seconds = 600.0
max_depth = 16
score_children_early = true
tactic_timeout_seconds = 10.0
forbidden_steps = [
    "exact?",
    "apply?",
    "rw?",
    "simp?",
    "simp_all?",
    "dsimp?",
    "aesop?",
    "hint",
    "rw_search",
    "library_search",
]

[expander]
kind = "automation_then_policy"
overlap = true

[automation]
tactics = [
    "decide",
    "omega",
    "intros",
    "constructor",
    "rfl",
    "simp",
    "field_simp",
    "norm_num",
    "linarith",
    "ring_nf",
    "simp_all",
    "nlinarith",
    "aesop",
]
timeout_seconds = 10.0
max_wall_clock_timeouts_per_tactic = 1

[priority]
kind = "a_star"
value_weight = 0.5

[policy]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
adapter = "policy-ei1"
sample_count = 16
temperature = 0.8
top_p = 1.0
max_tokens = 256
thinking = false
few_shot = false

[value]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
adapter = "value-v1"

[value.readout]
eight_or_more_steps = 12.0
dead_steps = 16.0
