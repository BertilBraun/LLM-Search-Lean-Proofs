# Expert-iteration round 0 policy SFT (experiments/phase2_sft.py): continue the SFT v2 adapter on the round's proof
# steps plus an equal token share of traced human steps (experiments/phase6_data.py), one epoch on one GPU at a
# quarter of SFT's learning rate. The validation steps are SFT v2's, so the losses compare directly.
model = "Qwen/Qwen3.5-2B"
data = "../expert_iteration/round_0/policy_sft"
merge = false
initial_adapter = "/workspace/checkpoints/phase2_sft_v2/adapter"

# Unused: the initial adapter brings its own rank and alpha.
[lora]
rank = 64
alpha = 64
dropout = 0.0

[optimization]
method = "lora"
learning_rate = 5e-5
warmup_fraction = 0.03
minimum_learning_rate_ratio = 0.1
weight_decay = 0.0
max_gradient_norm = 1.0
epochs = 1
micro_batch_tokens = 32768
micro_batches_per_step = 1
length_group_examples = 4096
gradient_checkpointing = true
# 1.5x the tokens/s of padded batches (results/gpu_utilization/).
packing = true
compile_layers = true
seed = 0

[evaluation]
interval_steps = 50
validation_examples = 2000
micro_batch_tokens = 16384
generation_examples = 256
generation_batch_size = 64
max_new_tokens = 256
