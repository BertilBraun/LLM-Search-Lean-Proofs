# The continuous expert-iteration loop (experiments/phase6_loop.py commands prints how to start it). Many concurrent
# searches over a curriculum of verified known-proof statements (pool v3) whose difficulty band follows the solve
# rate, each escalating its budget on the same tree (64, 192, 512 expansions) while its open frontier stays close to
# a proof; after 400 new proofs (or 60 minutes) they pause in place, both GPUs train the policy (DPO + NLL) and the
# value model from FIFO replay buffers, the next version is published and the searches continue. Version 0 is the
# reasoning bootstrap's policy with value v0. Version 0 and every 3rd version are evaluated on miniF2F-valid at 32
# expansions.
name = "phase6_loop"

# The reasoning bootstrap's adapter (thinking 42% per sample at 234 tokens; non-thinking 46%, as SFT v2) and value v0;
# init --policy-adapter / --value-adapter override them.
[initial]
policy_adapter = "/workspace/checkpoints/phase5_sft_bootstrap_r1/adapter"
value_adapter = "/workspace/checkpoints/phase3_value_v0/adapter"

# Per GPU a merged-policy and a merged-value vLLM instance without LoRA, started with SLEEP_MODE=1 so that a phase
# frees the GPUs in place and reloads the new weights in seconds (deployment/README.md, results/gpu_utilization/).
[serving]
base_model = "Qwen/Qwen3.5-2B"
tokenizer = "Qwen/Qwen3.5-2B"
policy_model = "policy-merged"
value_model = "value-merged"

[[serving.policy_servers]]
name = "policy-gpu0"
gpu = 0
url = "http://127.0.0.1:8100/v1"
memory_share = 0.58

[[serving.policy_servers]]
name = "policy-gpu1"
gpu = 1
url = "http://127.0.0.1:8101/v1"
memory_share = 0.58

[[serving.value_servers]]
name = "value-gpu0"
gpu = 0
url = "http://127.0.0.1:8200/v1"
memory_share = 0.30

[[serving.value_servers]]
name = "value-gpu1"
gpu = 1
url = "http://127.0.0.1:8201/v1"
memory_share = 0.30

[search]
search_config = "experiments/configs/expert_iteration/loop_search.toml"
# The open pool without known proofs (pool v2), an optional later source: open_share of the fresh starts.
open_candidates = ""
open_share = 0.0
# Stale frontier states (scored by an older value model) re-scored together when one reaches the top.
lazy_rescore_states = 32

# Concurrent searches (one REPL each), the service pinned to 40 CPUs (results/gpu_utilization/: 120 searches keep
# both GPUs at 95-96% with the merged instances).
concurrency = 120
shard_attempts = 1000
shard_minutes = 10.0
heartbeat_seconds = 30.0

# The policy's mode in the searches, the evaluation and the training pairs: thinking samples (n = 8 as without) of at
# most max_tokens tokens with the bootstrap's plain prompt; each phase then shortens long reasoning before training
# (training.compress_reasoning). The equal-token comparison decides it.
[search.thinking]
enabled = false
max_tokens = 512
instruction = ""

[search.harvest]
max_remaining_steps = 1.5
max_expansions = 8

# difficulty = 0.5 x (tactics of the verified known proof) + 0.5 x (the current value model's root h); the band
# [low, low + width] starts at the easiest statement the automation does not close and moves by band_step after
# `window` outcomes: up at a solve rate of at least 50%, down below 30%.
[search.curriculum]
verified = "expert_iteration/pool_v3/verified.jsonl"
minimum_statements = 3000
proof_steps_weight = 0.5
root_value_weight = 0.5
characters_weight = 0.0
band_width = 1.0
band_step = 0.5
window = 50
raise_solve_rate = 0.5
# At 80% solved or more the band moves 1.5 at once.
fast_raise_solve_rate = 0.8
fast_band_step = 1.5
lower_solve_rate = 0.3
root_value_refresh = 4096
reload_seconds = 300.0
seed = "phase6-curriculum"

[search.scheduler]
promising_depth = 0
# At most 30 of the 120 searches run stages 1-2 (near the frontier stage 1 found 3.5x fewer proofs per generated token
# than stage 0, and the frontier h barely predicts which escalations pay).
max_escalated_share = 0.25

# Each stage's budget is a total over the statement's search; a stage is entered when the best h on the open frontier
# is at most max_frontier_value. The stages' proofs per GPU-hour (phase6_loop.py metrics) tune these gates. At n = 8
# (loop_search.toml) an expansion costs about half of one at n = 16: 64 / 192 / 512 expansions are 512 / 1,536 / 4,096
# generations (the n = 16 plan's 32 / 128 / 512 were 512 / 2,048 / 8,192), the last stage capped at 512 expansions;
# the wall caps keep about 9.4 s per expansion.
[[search.scheduler.stages]]
max_expansions = 64
max_wall_seconds = 600.0

[[search.scheduler.stages]]
max_expansions = 192
max_wall_seconds = 1800.0
max_frontier_value = 3.0

[[search.scheduler.stages]]
max_expansions = 512
max_wall_seconds = 4800.0
max_frontier_value = 2.0

# NuminaMath candidates rarely have any known proof (0.1% in the untraced Goedel-Prover set).
[[search.scheduler.source_weights]]
name = "numinamath_lean"
weight = 0.3

[training]
new_proofs = 400
min_minutes = 20.0
max_minutes = 60.0
minimum_new_proofs = 20
check_seconds = 30.0
# Lazy re-scoring (search.lazy_rescore_states) replaces re-scoring every frontier right after a phase.
rescore_frontier = false
rescore_max_seconds = 60.0
seed = "phase6-loop"
held_out_fraction = 0.02
max_labels_per_tree = 16
# Per-phase training caps (~10 minutes of training).
max_policy_samples = 4096
max_value_samples = 9600
chosen_only_steps = false
traced_directory = "traced"
value_dataset = "v0"
# In thinking mode, shorten long reasoning of proof-step pairs before training (the reasoning module).
compress_reasoning = true

[training.policy]
config = "experiments/configs/expert_iteration/loop_policy.toml"
gpu = 0

[training.value]
config = "experiments/configs/expert_iteration/loop_value.toml"
gpu = 1

# Capacities start here and then hold about 3.5 phases of the measured inflow.
[training.policy_buffer]
initial_capacity = 10000
minimum_capacity = 2000
capacity_phases = 3.5
reuse = 1.0
minimum_dataset_share = 0.1

[training.value_buffer]
initial_capacity = 80000
minimum_capacity = 16000
capacity_phases = 3.5
reuse = 1.0
minimum_dataset_share = 0.1

[training.preferences]
max_dead_per_node = 2
max_failed_per_node = 1
policy_steps_only = true
dead_subtrees = true

# Off until the value model ranks held-out fresh trees well (v0: Spearman ~0.70, dead AUC ~0.45).
[training.value_jumps]
enabled = true
chosen_max_value = 1.5
margin = 3.0
max_per_node = 2
gate_spearman = 0.7
gate_dead_auc = 0.75
gate_minimum_states = 50

# Dead-end labels stay: v0 puts dead ends ~2.3 steps from done, and they are what corrects that.
[training.labels]
at_least_weight = 1.0
dead_weight = 0.5

[[training.traced_sources]]
name = "goedel_lean_workbook_proofs"
weight = 1.0

[[training.traced_sources]]
name = "stp_lean_workbook"
weight = 1.0

[[training.traced_sources]]
name = "deepseek_prover_v1"
weight = 1.0

[[training.traced_sources]]
name = "lean_workbook"
weight = 1.0

[[training.traced_sources]]
name = "goedel_sft_v2"
weight = 1.0

[[training.traced_sources]]
name = "numinamath_lean_kimina"
weight = 1.0

[[training.traced_sources]]
name = "numinamath_lean_human"
weight = 1.0

[[training.traced_sources]]
name = "leanabell_sft"
weight = 1.0

# Inside every 3rd phase's pause (searches paused): the GPUs and the service's 40 CPUs to itself.
[evaluation]
config = "experiments/configs/expert_iteration/loop_evaluation.toml"
every_versions = 3
max_expansions = 32
concurrency = 120
check_seconds = 120.0
