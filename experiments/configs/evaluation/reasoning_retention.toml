# Reasoning-retention check: does Lean training damage general mathematical reasoning? MATH-500 subset solved in
# natural language with thinking on; every model is a base checkpoint or a LoRA adapter served on its base.
#   python experiments/reasoning_retention.py --config experiments/configs/evaluation/reasoning_retention.toml problems
#   python experiments/reasoning_retention.py --config ... run --gpu 0 --labels qwen3.5-2b qwen3.5-2b-sft-v2 ...
#   python experiments/reasoning_retention.py --config ... summarize
dataset = "/workspace/data/math500/test.jsonl"
problem_count = 200
judged_problem_count = 20
seed = "reasoning-retention"
sample_count = 4
temperature = 0.6
# Qwen's recommended sampling for thinking mode; temperature is the owner's.
top_p = 0.95
max_tokens = 4096
max_model_length = 8192
requests_in_flight = 64
# A literal string: in a basic TOML string the backslash of \boxed would start the escape \b (backspace).
instruction = 'Please reason step by step, and put your final answer within \boxed{}.'

[[models]]
label = "qwen3.5-2b"
base = "Qwen/Qwen3.5-2B"

[[models]]
label = "qwen3.5-2b-sft-v2"
base = "Qwen/Qwen3.5-2B"
adapter = "/workspace/checkpoints/phase2_sft_v2/adapter"

[[models]]
label = "qwen3.5-2b-bootstrap-r1"
base = "Qwen/Qwen3.5-2B"
adapter = "/workspace/checkpoints/phase5_sft_bootstrap_r1/adapter"

[[models]]
label = "qwen3.5-4b"
base = "Qwen/Qwen3.5-4B"

[[models]]
label = "qwen3.5-4b-sft"
base = "Qwen/Qwen3.5-4B"
adapter = "/workspace/checkpoints/phase2_sft_4b/adapter"

[[models]]
label = "qwen3.5-4b-student"
base = "Qwen/Qwen3.5-4B"
# The reasoning agent's student run; skipped until the adapter exists.
adapter = "/workspace/checkpoints/phase5_sft_student_4b/adapter"

[[models]]
label = "qwen3.5-4b-sft-gentle"
base = "Qwen/Qwen3.5-4B"
# The 4B Lean SFT with 18% general math worked solutions mixed in (phase2_sft_4b_gentle).
adapter = "/workspace/checkpoints/phase2_sft_4b_gentle/adapter"
