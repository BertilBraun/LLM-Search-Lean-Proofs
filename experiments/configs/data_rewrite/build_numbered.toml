# Naming A/B, numbered arm: the rewritten data with the corpora's hypothesis names (h₀, h₁, …).
#   python experiments/data_rewrite.py build --config experiments/configs/data_rewrite/build_numbered.toml \
#       --name visible_student_v3_numbered
# The named arm (build_named.toml) uses the same items and chunks; only the names differ.
rewrite_run = "data_rewrite_v1"
variant = "numbered"
# One visible chunk example (the teacher's explanation, explain_chunks.toml) per train reasoning example, so the
# block-length variation reaches the visible mode the loop samples in. Non-visible chunk examples keep the build's
# earlier share of the train examples for the reasoning-free mode (one per reasoning example before: 50%), so the
# train set grows from 2 to 4 examples per reasoning example; 1/3 would keep their earlier count instead
# (v2 replayed 0.21 one-tactic steps per reasoning example).
visible_chunk_examples_per_reasoning_example = 1.0
non_visible_share = 0.5
# Validation lists the non-visible chunk examples first (the trainer's greedy check), then the visible ones.
validation_chunk_examples = 500
validation_visible_chunk_examples = 500
max_prompt_tokens = 2048
max_completion_tokens = 512
tokenizer = "Qwen/Qwen3.5-4B"
seed = "data-rewrite-v1"

# k ∈ {1, 3, 5, 7, rest of the proof}, drawn once per start state (0 = the rest).
[[chunk_lengths]]
tactics = 1
weight = 1.0

[[chunk_lengths]]
tactics = 3
weight = 1.0

[[chunk_lengths]]
tactics = 5
weight = 1.0

[[chunk_lengths]]
tactics = 7
weight = 1.0

[[chunk_lengths]]
tactics = 0
weight = 1.0
