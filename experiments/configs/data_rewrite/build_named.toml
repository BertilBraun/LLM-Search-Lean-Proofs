# Naming A/B, named arm: the rewritten data with descriptive hypothesis names (hx_pos, h_sum, …) in statements,
# states, `have`s and explanations.
#   python experiments/data_rewrite.py build --config experiments/configs/data_rewrite/build_named.toml \
#       --name visible_student_v3_named
# Everything but `variant` matches build_numbered.toml, so both arms hold the same items and chunks.
rewrite_run = "data_rewrite_v1"
variant = "named"
chunk_examples_per_reasoning_example = 1.0
validation_chunk_examples = 500
max_prompt_tokens = 2048
max_completion_tokens = 512
tokenizer = "Qwen/Qwen3.5-4B"
seed = "data-rewrite-v1"

[[chunk_lengths]]
tactics = 1
weight = 1.0

[[chunk_lengths]]
tactics = 3
weight = 1.0

[[chunk_lengths]]
tactics = 5
weight = 1.0

[[chunk_lengths]]
tactics = 7
weight = 1.0

[[chunk_lengths]]
tactics = 0
weight = 1.0
