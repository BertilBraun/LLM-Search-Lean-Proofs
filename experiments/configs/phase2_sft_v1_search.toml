# Ablation-ladder row 2: the automation sweep plus the SFT policy (LoRA adapter policy-v1 on Qwen3.5-2B), best-first
# on the cumulative log-probability, the row-1 budget. Two vLLM servers (one per RTX 3090) serve the base model with
# the policy and value adapters; requests go round-robin. After SFT the search is Lean-bound, so the pool is sized
# to the CPU quota.

[lean]
pool_size = 40
concurrency = 40

[search]
max_expansions = 64
max_wall_seconds = 600.0
max_depth = 16
tactic_timeout_seconds = 10.0
forbidden_steps = [
    "exact?",
    "apply?",
    "rw?",
    "simp?",
    "simp_all?",
    "dsimp?",
    "aesop?",
    "hint",
    "rw_search",
    "library_search",
]

[expander]
kind = "automation_then_policy"

[automation]
tactics = [
    "decide",
    "omega",
    "intros",
    "constructor",
    "rfl",
    "simp",
    "field_simp",
    "norm_num",
    "linarith",
    "ring_nf",
    "simp_all",
    "nlinarith",
    "aesop",
]
timeout_seconds = 10.0
max_wall_clock_timeouts_per_tactic = 1

[priority]
kind = "cumulative_log_probability"
length_exponent = 1.0
# Median log-probability of the probe samples that made progress at temperature 0.8 (results/phase1_probe).
automation_log_probability = -12.0

[policy]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
adapter = "policy-v1"
sample_count = 16
temperature = 0.8
top_p = 1.0
# SFT completions were capped at 256 tokens; SFT samples average ~26 tokens, so the cap rarely binds.
max_tokens = 256
thinking = false
few_shot = false
