# Short identical LoRA SFT runs that decide the base model: one run per candidate (--model), same data and budget.
model = "Qwen/Qwen3.5-2B"
data = "model_choice"
merge = true

[lora]
rank = 64
alpha = 64
dropout = 0.0

[optimization]
method = "lora"
learning_rate = 2e-4
warmup_fraction = 0.03
minimum_learning_rate_ratio = 0.1
weight_decay = 0.0
max_gradient_norm = 1.0
epochs = 1
micro_batch_tokens = 32768
micro_batches_per_step = 1
length_group_examples = 4096
gradient_checkpointing = true
seed = 0

[evaluation]
interval_steps = 50
validation_examples = 1000
micro_batch_tokens = 16384
generation_examples = 128
generation_batch_size = 64
max_new_tokens = 256
