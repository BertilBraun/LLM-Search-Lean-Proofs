# Gentle 4B SFT v2: the phase2_sft_4b recipe and Lean data (20M tokens) plus the base model's own answer-checked
# math solutions (`self_v1`, phase2_sft_self_solutions.py): about 8,000 visible non-thinking solutions and a few
# hundred thinking-mode ones. v1 mixed in terse reference solutions and fell to 47% on MATH-500 (forced, visible).
# Run by experiments/phase2_sft_4b_gentle_v2_chain.sh.
model = "Qwen/Qwen3.5-4B"
data = "4b"
merge = false
math_data = "self_v1"

[lora]
rank = 64
alpha = 64
dropout = 0.0

[optimization]
method = "lora"
learning_rate = 2e-4
warmup_fraction = 0.03
minimum_learning_rate_ratio = 0.1
weight_decay = 0.0
max_gradient_norm = 1.0
epochs = 1
micro_batch_tokens = 16384
micro_batches_per_step = 2
length_group_examples = 4096
gradient_checkpointing = true
packing = true
compile_layers = true
seed = 0

[evaluation]
interval_steps = 1000
validation_examples = 1000
micro_batch_tokens = 16384
generation_examples = 128
generation_batch_size = 16
max_new_tokens = 256
