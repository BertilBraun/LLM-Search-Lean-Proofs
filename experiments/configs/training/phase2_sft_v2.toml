# SFT v2, the final policy SFT: Qwen3.5-2B, LoRA, one epoch over the 60M-token `v2` data, served as an adapter on
# the raw base (no merge). On both GPUs (32k tokens per GPU, 64k per step):
#   torchrun --nproc-per-node 2 experiments/phase2_sft.py --config experiments/configs/training/phase2_sft_v2.toml \
#       --run-name phase2_sft_v2
model = "Qwen/Qwen3.5-2B"
data = "v2"
merge = false

[lora]
rank = 64
alpha = 64
dropout = 0.0

[optimization]
method = "lora"
learning_rate = 2e-4
warmup_fraction = 0.03
minimum_learning_rate_ratio = 0.1
weight_decay = 0.0
max_gradient_norm = 1.0
epochs = 1
micro_batch_tokens = 32768
micro_batches_per_step = 1
length_group_examples = 4096
gradient_checkpointing = true
seed = 0

[evaluation]
interval_steps = 200
validation_examples = 2000
micro_batch_tokens = 16384
generation_examples = 256
generation_batch_size = 64
max_new_tokens = 256
