# Qwen3.5-4B student SFT data: a 20M-token subsample of the SFT v2 mix from the same snapshot
# (phase2_sft_data.py --snapshot). Weights are v2's per-source tokens in millions, so the shares match v2's; no
# source runs out at this budget. Completions are capped at the search's policy max_tokens (256).
token_budget = 20_000_000
max_prompt_tokens = 2048
max_completion_tokens = 256
validation_examples = 2000
reference_tokenizer = "Qwen/Qwen3.5-2B"
seed = "sft-4b"

