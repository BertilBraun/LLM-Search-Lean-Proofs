# SFT v2 data: the merged tracing snapshot after the narrowed full run (phase2_sft_data.py --snapshot), 60M tokens
# with equal token shares: small sources are used whole and their unused shares go to the large ones (STP and
# Goedel workbook). Completions are capped at the search's policy max_tokens (256).
token_budget = 60_000_000
max_prompt_tokens = 2048
max_completion_tokens = 256
validation_examples = 2000
reference_tokenizer = "Qwen/Qwen3.5-2B"
seed = "sft-v2"

