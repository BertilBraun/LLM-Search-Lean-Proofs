# The GRPO loop's held-out statement sets (experiments/grpo_fixed_sets.py, DESIGN.md "Fixed targets"): the probe set
# (~500 statements) and the gate set (~400, the value benchmark's), both verified pool v3 statements, stratified easy /
# medium / hard by the curriculum's difficulty estimate (the same weights as loop.toml's curriculum; before the value
# model scores a root, the difficulty is the known proof's top-level tactic count), disjoint, never fed to the loop; and
# the overfit test's 300 statements outside both.
#   python experiments/grpo_fixed_sets.py --config experiments/configs/grpo/fixed_sets.toml select
#   python experiments/grpo_fixed_sets.py --config experiments/configs/grpo/fixed_sets.toml select-overfit
# Verified statements have known proofs of 2 to 12+ top-level tactics, about evenly (pool v3 verifies round-robin
# over proof lengths, nothing under 2): easy 2-3, medium 4-6, hard 7+.
medium_from = 4.0
hard_from = 7.0
probe_per_stratum = 167
gate_per_stratum = 134
overfit_per_stratum = 100
seed = "grpo-fixed-sets"
probe_set = "grpo/fixed_sets/probe.jsonl"
gate_set = "grpo/fixed_sets/gate.jsonl"
overfit_set = "grpo/fixed_sets/overfit_300.jsonl"

[curriculum]
verified = "expert_iteration/pool_v3/verified.jsonl"
unverified = ""
proof_steps_weight = 0.5
root_value_weight = 0.5
characters_weight = 0.0
