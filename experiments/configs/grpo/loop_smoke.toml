# The smoke cycle before anything long (deployment/README.md, "GRPO loop", bring-up step 3): the whole loop on the
# overfit statements with visible student v2 as the starting policy (the SFT stage's adapter does not exist yet), short
# phases, a value phase every phase whose gate every candidate passes (phase_smoke.toml), and every evaluation at a
# tiny size, so the first hour sees: the at-start baselines (probe twice, miniF2F, held-out states), one pause with
# policy and value training, both GPU merges, the publish and the wake, then the value servers' swap to the fixed v0
# model for the probe and the value A/B search with both arms. Run two phases, check the first-hour list, stop it and
# delete its run and checkpoints (grpo_smoke*).
#   python experiments/grpo_fixed_sets.py --config experiments/configs/grpo/fixed_sets.toml gate-benchmark \
#       --search-config experiments/configs/grpo/gate_search.toml --run-name grpo_smoke_gate_search \
#       --output grpo_smoke_gate/benchmark.json.gz --problems 60     # with the smoke's version 0 served
#   LOOP_CONFIG=experiments/configs/grpo/loop_smoke.toml deployment/grpo_loop.sh init      # then servers, check, loop
name = "grpo_smoke"

[initial]
policy_adapter = "/workspace/checkpoints/phase5_sft_visible_student_v2/adapter"
value_adapter = "/workspace/checkpoints/phase3_value_v0/adapter"

[serving]
policy_base_model = "Qwen/Qwen3.5-4B"
value_base_model = "Qwen/Qwen3.5-2B"
policy_model = "policy-merged"
value_model = "value-merged"

[[serving.policy_servers]]
name = "policy-gpu0"
gpu = 0
url = "http://127.0.0.1:8100/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu1"
gpu = 1
url = "http://127.0.0.1:8101/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu2"
gpu = 2
url = "http://127.0.0.1:8102/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu3"
gpu = 3
url = "http://127.0.0.1:8103/v1"
memory_share = 0.62

[[serving.value_servers]]
name = "value-gpu0"
gpu = 0
url = "http://127.0.0.1:8200/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu1"
gpu = 1
url = "http://127.0.0.1:8201/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu2"
gpu = 2
url = "http://127.0.0.1:8202/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu3"
gpu = 3
url = "http://127.0.0.1:8203/v1"
memory_share = 0.28
max_num_seqs = 96

[sampling]
search_config = "experiments/configs/grpo/search/visible_student_v2.toml"
# The real run's concurrency, so host memory and Lean CPU are measured under the real load.
concurrency = 112
status_seconds = 30.0

[training]
phase_config = "experiments/configs/grpo/phase_smoke.toml"
gpus = [0, 1, 2, 3]
min_sampling_minutes = 5.0
max_sampling_minutes = 10.0
min_solved_trees = 10
check_seconds = 30.0
# A value phase every phase, on that phase's trees, gated on the tiny benchmark above.
value_every_phases = 1
value_window_phases = 1
value_share_after_gate = 0.15
value_benchmark = "grpo_smoke_gate/benchmark.json.gz"
# The SFT stage's replay data do not exist yet; v0's value data come from the node backup.
lean_replay = ""
math_replay = ""
value_replay = "value/v0/train.jsonl"
paused_repl_memory_gib = 0.0

[statements]
kind = "fixed"
fixed = "grpo/fixed_sets/overfit_300.jsonl"

[evaluation]
probe_set = "grpo/fixed_sets/probe.jsonl"
value_model = "initial"
held_out_states_file = "phase5_eval_visible_student_v2_visible/states.jsonl"
paused_repl_memory_gib = 0.0

# At the start twice (the repeat comparison), then after every phase (the swap to v0's kept value weights).
[evaluation.probe]
max_expansions = 16
max_wall_seconds = 3600.0
concurrency = 64
every_hours = 0.01
at_start = true
baseline_runs = 2
problems = 12

[evaluation.minif2f]
max_expansions = 64
max_wall_seconds = 7200.0
concurrency = 64
every_hours = 0.0
at_start = true
problems = 8

[evaluation.held_out_states]
max_expansions = 1
max_wall_seconds = 600.0
concurrency = 64
every_hours = 0.0
at_start = true
problems = 32

# After the first phase published a value model.
[evaluation.value_ab]
max_expansions = 16
max_wall_seconds = 3600.0
concurrency = 64
every_hours = 0.01

[evaluation.value_ab_test]
problems = 12
significance = 0.05

[retention]
adapter_versions = 1

[renaming]
enabled = false
renamings = ["grpo/renamings.jsonl"]
