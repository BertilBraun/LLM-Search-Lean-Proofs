# The smoke cycle before anything long (deployment/README.md, "GRPO loop", bring-up step 3): the whole loop on the
# overfit statements with visible student v2 as the starting policy (the SFT stage's adapter does not exist yet), short
# phases, a value phase every phase, and every evaluation at a tiny size and a short wall cap, so the first hour or so
# sees: version 0's baselines all at once before sampling (every probe part twice, miniF2F, the held-out states; 8
# runs of 14 REPLs), the value benchmark scored by v0 through the value servers, one pause with policy and value
# training (once the evaluations beside sampling finished, at most 30 min after it was due), both GPU merges, the
# publish and the wake, the held-out states at the pause, the new value model scoring the benchmark and a probe slot
# with it beside sampling, the searches refilling the REPLs its tail leaves. Run two phases, check the first-hour
# list, stop it and delete its run and checkpoints (grpo_smoke*). It scores the loop's value benchmark
# (deployment/grpo_loop.sh gate first).
#   LOOP_CONFIG=experiments/configs/grpo/loop_smoke.toml deployment/grpo_loop.sh init      # then servers, check, loop
name = "grpo_smoke"

[initial]
policy_adapter = "/workspace/checkpoints/phase5_sft_visible_student_v2/adapter"
value_adapter = "/workspace/checkpoints/phase3_value_v0/adapter"

[serving]
policy_base_model = "Qwen/Qwen3.5-4B"
value_base_model = "Qwen/Qwen3.5-2B"
policy_model = "policy-merged"
value_model = "value-merged"

[[serving.policy_servers]]
name = "policy-gpu0"
gpu = 0
url = "http://127.0.0.1:8100/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu1"
gpu = 1
url = "http://127.0.0.1:8101/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu2"
gpu = 2
url = "http://127.0.0.1:8102/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu3"
gpu = 3
url = "http://127.0.0.1:8103/v1"
memory_share = 0.62

[[serving.value_servers]]
name = "value-gpu0"
gpu = 0
url = "http://127.0.0.1:8200/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu1"
gpu = 1
url = "http://127.0.0.1:8201/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu2"
gpu = 2
url = "http://127.0.0.1:8202/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu3"
gpu = 3
url = "http://127.0.0.1:8203/v1"
memory_share = 0.28
max_num_seqs = 96

[sampling]
search_config = "experiments/configs/grpo/search/visible_student_v2.toml"
max_expansions = 32
# The real run's concurrency, so host memory and Lean CPU are measured under the real load.
concurrency = 112
min_concurrency_beside_evaluations = 56
status_seconds = 30.0

[training]
phase_config = "experiments/configs/grpo/phase.toml"
gpus = [0, 1, 2, 3]
min_sampling_minutes = 5.0
max_sampling_minutes = 10.0
min_trainable_groups = 30
check_seconds = 30.0
# A value phase every phase, on that phase's trees.
value_every_phases = 1
value_window_phases = 1
# The SFT stage's replay data do not exist yet; v0's value data come from the node backup.
lean_replay = ""
math_replay = ""
value_replay = "value/v0/train.jsonl"
paused_repl_memory_gib = 0.0
# The persistent trainer, as the main loop runs it.
persistent = true

[statements]
kind = "fixed"
fixed = "grpo/fixed_sets/overfit_300.jsonl"

[evaluation]
probe_set = "grpo/fixed_sets/probe.jsonl"
value_model = "published"
beside_sampling = true
held_out_states_file = "phase5_eval_visible_student_v2_visible/states.jsonl"
paused_repl_memory_gib = 0.0

# Every part at the start twice (the repeat comparison), then a slot after every phase, beside sampling as in the main
# loop; 12 problems: 4 per part. Short wall caps keep the cycle near an hour.
probe_parts = 3

[evaluation.probe]
max_expansions = 16
max_wall_seconds = 600.0
concurrency = 56
every_hours = 0.01
at_start = true
baseline_runs = 2
problems = 12

[evaluation.value_arm]
enabled = false
confidence = 0.95
significance = 0.05

# The loop's own: a separate smoke gate search would hold the servers through its own Lean-bound tail.
[evaluation.value_benchmark]
path = "grpo_gate/benchmark.json.gz"

[evaluation.minif2f]
max_expansions = 64
max_wall_seconds = 900.0
concurrency = 56
every_hours = 0.0
at_start = true
problems = 4

[evaluation.held_out_states]
max_expansions = 1
max_wall_seconds = 600.0
concurrency = 112
every_hours = 0.01
at_start = true
problems = 32

[retention]
adapter_versions = 1

[renaming]
enabled = false
renamings = ["grpo/renamings.jsonl"]
