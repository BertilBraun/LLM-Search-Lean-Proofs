# Arm D, interleaved (DESIGN.md, "Follow-up study: controlled arms", "Arms"): at every pause the F screen's GRPO
# update, then C's expert-iteration round over C's window (followup/expert_iteration.toml's recipe), published together
# as the phase's one version; the KL reference stays v0. So D is C's schedule plus F's GRPO step, and D against C
# measures what the GRPO step adds (owner, 2026-11-23, after F at 16 phases tied C).
# The follow-up base and its phase template changed only in the lines below, the recipe only in its learning rate
# (experiments/followup_arm.py writes the loop's configs; src/lean_search/rl/README.md, "Expert iteration inside the
# loop").
[loop]
name = "followup_D"

[loop.training]
policy_update = "grpo_and_expert_iteration"
expert_iteration_every_phases = 1
expert_iteration_window_phases = 4

[phase.policy.data]
# The F screen's credit (screens/F_2e-5.toml).
credit = "verified_fraction"

[phase.policy.optimization]
learning_rate = 2e-5

[expert_iteration.sft.optimization]
learning_rate = 5e-5
