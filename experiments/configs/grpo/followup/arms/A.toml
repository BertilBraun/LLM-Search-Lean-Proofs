# Arm A, per-tactic graph credit GRPO (DESIGN.md, "Follow-up study: controlled arms", "Arms"): the follow-up base
# (followup/base.toml) with its phase template (grpo/phase.toml), changed only in the lines below; the loop reads the
# configs experiments/followup_arm.py writes from it, which refuses while a PLACEHOLDER is left.
[loop]
name = "followup_A"

[phase.policy.data]
credit = "per_tactic"

[phase.policy.optimization]
# Step 2 tied 2e-5 and 5e-5 on the held-out states; the owner chose 5e-5, as C and D use (2026-11-18).
learning_rate = 5e-5
