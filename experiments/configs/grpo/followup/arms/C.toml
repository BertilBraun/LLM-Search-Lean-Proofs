# Arm C, expert iteration (DESIGN.md, "Follow-up study: controlled arms", "Arms"): at every pause, instead of a GRPO
# update, a fine-tuning round continuing the published policy adapter on the verified proof-graph blocks of the last W
# phases (followup/expert_iteration.toml's recipe: the hand-run round's selection, 30% Lean and 10% math replay by
# completion tokens, 1 epoch, warmup 3% and cosine to 0.1x, no KL penalty, every round published). The follow-up base
# and its phase template changed only in the lines below, the recipe only in its learning rate
# (experiments/followup_arm.py writes the loop's configs; src/lean_search/rl/README.md, "Expert iteration inside the
# loop").
[loop]
name = "followup_C"

[loop.training]
policy_update = "expert_iteration"
expert_iteration_every_phases = 1
# The owner's choice of 2026-11-17 (DESIGN.md, "Step 2").
expert_iteration_window_phases = 4

[expert_iteration.sft.optimization]
# The offline run O2's choice between 5e-5 and 1e-4 (the same recipe and trainer; owner, 2026-11-17).
learning_rate = "PLACEHOLDER: O2's learning rate (the offline chain's rank_matched.txt)"
