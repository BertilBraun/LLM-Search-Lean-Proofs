# The automation constant's calibration for step_log_probability = "block_sum" (DESIGN.md, "Step 1", Q4): one
# expansion of v0 without a value model at the root of each of the 200 calibration statements
# (calibration_statements.toml: pool statements outside every held-out set), read by
# experiments/followup_step1.py automation-constant. Its own output, so the probe rating never sees it.
loop_config = "experiments/configs/grpo/followup/base.toml"
search_config = "experiments/configs/grpo/search/visible_student_v2.toml"
probe_set = "grpo/fixed_sets/calibration_200.jsonl"
# Accepted only with fewer than 1% of the searches stopped on the wall clock (DESIGN.md, "Evaluation"); a rejected run
# is repeated with the cap doubled, and every run it is compared with at the same cap.
max_wall_clock_stop_share = 0.01
output = "calibration_evaluations"

[probe]
# The root only: its policy samples are the calibration's.
max_expansions = 1
# Per statement, only an emergency stop.
max_wall_seconds = 7200.0
# THROUGHPUT TEST: a placeholder; the throughput test sets one probe concurrency for every run of the study.
concurrency = 56

[value_free_priority]
length_exponent = 1.0
step_log_probability = "block_sum"

# One expansion never ranks a policy step against an automation step, so the constant does not act here; marked
# calibrated only so that probe_evaluate.py runs (review AF's estimate stands in).
[[value_free_priority.automation_constants]]
step_log_probability = "block_sum"
automation_log_probability = -5.65
calibrated = true
