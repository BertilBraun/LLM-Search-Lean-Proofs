# Step 1's run 3 (DESIGN.md, "Follow-up study: controlled arms", "Step 1"): v0 visible at the token cap T, the twin of
# run 4 (token_capped_no_reasoning.toml), which it alone is compared with (experiments/probe_compare.py pair
# --across-search-modes). visible_student_v2.toml with an expansion budget and depth cap at four times the expected
# counts, the generated-token cap T (SearchConfig.max_generated_tokens, checked before each expansion, so the last one
# overshoots by up to one expansion: ~1.7k tokens, ~6% of T, visible) and depth_weight 0. Each search records which
# limit ended it. If run 3 lands 3 or more points below run 1, Q3 is reported with the caveat that depth_weight 0
# changed the tuned search.
[search]
# Four times the expected ~160 expansions at T: the token cap ends the search, not this.
max_expansions = 1024
# Expansions are the budget; the wall cap only catches hung searches.
max_wall_seconds = 14400.0
max_depth = 64
# T = 16 x run 1's mean generated tokens per expansion (~27k): experiments/followup_step1.py token-budget
# prints it from the accepted anchor runs; the launcher refuses this file until it is set.
max_generated_tokens = "PLACEHOLDER T: experiments/followup_step1.py token-budget"
score_children_early = true
# Policy steps stop at 50k heartbeats inside Lean, an ordinary error without a restart.
tactic_heartbeats = 50000
# Emergency stop for hangs heartbeats do not count (kernel reduction, big-number arithmetic).
tactic_timeout_seconds = 60.0
flatten_blocks = true
name_inaccessible_hypotheses = true
check_identifiers = true
forbidden_steps = [
    "exact?",
    "apply?",
    "rw?",
    "simp?",
    "simp_all?",
    "dsimp?",
    "aesop?",
    "hint",
    "rw_search",
    "library_search",
]

# DESIGN.md "The loop": after the first proof, finish the proving expansion, then expand states the value model puts
# at most 2 tactics from done, for up to 16 more expansions. Off for evaluations.
[search.harvest]
enabled = true
max_remaining_steps = 2.0
max_expansions = 16

# With probability 0.1 the next expansion is drawn uniformly from the 8 best frontier states. Off for evaluations.
[search.exploration]
enabled = true
epsilon = 0.1
top_k = 8
seed = 0

[expander]
kind = "automation_then_policy"
overlap = true

[automation]
tactics = ["omega", "constructor", "rfl", "field_simp", "ring_nf", "simp_all", "nlinarith"]
# The sweep keeps Lean's default limit; the search's emergency stop applies.
heartbeats = 200000
max_wall_clock_timeouts_per_tactic = 1
max_heartbeat_timeouts_per_tactic = 1

[priority]
kind = "a_star"
value_weight = 1.0
# 0 in both modes: A*'s depth term counts blocks, and a block without reasoning is about one tactic against two or
# three, so 0.25 would push that search breadth-first.
depth_weight = 0.0
policy_prior_weight = 0.0
automation_log_probability = -1.0

[policy]
model = "policy-merged"
tokenizer = "Qwen/Qwen3.5-4B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
sample_count = 8
temperature = 0.8
top_p = 1.0
max_tokens = 1024
thinking = false
visible_reasoning = true
few_shot = false
force_answer_on_truncation = true
forced_answer_tokens = 256

[value]
model = "value-merged"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8200/v1", "http://127.0.0.1:8201/v1"]

[value.readout]
eight_or_more_steps = 12.0
dead_steps = 16.0
