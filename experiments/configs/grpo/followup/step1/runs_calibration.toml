# The automation constant's calibration (DESIGN.md, "Follow-up study: controlled arms", "Step 1", Q4): v0 without a
# value model, one expansion at the root of the 200 calibration statements (calibration_statements.toml), once per
# step_log_probability setting; then
#   python experiments/followup_step1.py automation-constant \
#       $LEAN_SEARCH_RUNS/calibration_evaluations/probe_calibration_{completion,block_sum,block_mean}
# prints the [value_free_priority] table of each value_free_<setting>.toml.
[[runs]]
name = "calibration_completion"
arm = "v0"
phase = 0
policy_adapter = "/workspace/checkpoints/data_rewrite_sft_numbered/adapter"
value = "none"
config = "experiments/configs/grpo/followup/step1/calibration_completion.toml"
purpose = "the automation constant for completion"

[[runs]]
name = "calibration_block_sum"
arm = "v0"
phase = 0
policy_adapter = "/workspace/checkpoints/data_rewrite_sft_numbered/adapter"
value = "none"
config = "experiments/configs/grpo/followup/step1/calibration_block_sum.toml"
purpose = "the automation constant for block_sum"

[[runs]]
name = "calibration_block_mean"
arm = "v0"
phase = 0
policy_adapter = "/workspace/checkpoints/data_rewrite_sft_numbered/adapter"
value = "none"
config = "experiments/configs/grpo/followup/step1/calibration_block_mean.toml"
purpose = "the automation constant for block_mean"
