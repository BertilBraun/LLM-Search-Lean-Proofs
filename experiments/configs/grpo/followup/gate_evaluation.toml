# The old gate set's 402 statements searched with any checkpoint (experiments/probe_evaluate.py): step 2's tie-breaker
# and sanity check when ranking a signal's learning rates (DESIGN.md, "Follow-up study: controlled arms", "Step 2";
# experiments/rank_learning_rates.py). probe_evaluation.toml on the gate set, into its own output so the probe rating
# never pools a gate run. Optional: about a fifth of a probe run each (~1 h), so the 13 step-2 variants and v0 cost
# ~11-17 node hours (~$10-15); without them the lowest tied rate is chosen.
#   python experiments/probe_evaluate.py --config experiments/configs/grpo/followup/gate_evaluation.toml \
#       --name step2_A_5e-5 --arm step2_A_5e-5 --phase 1 --policy-adapter <adapter> --value v0
loop_config = "experiments/configs/grpo/followup/base.toml"
search_config = "experiments/configs/grpo/search/visible_student_v2.toml"
probe_set = "grpo/fixed_sets/gate.jsonl"
# Accepted only with fewer than 1% of the searches stopped on the wall clock (DESIGN.md, "Evaluation"); a rejected run
# is repeated with the cap doubled, and every run it is compared with at the same cap.
max_wall_clock_stop_share = 0.01
output = "gate_evaluations"

[probe]
max_expansions = 16
# Per statement, only an emergency stop.
max_wall_seconds = 7200.0
# THROUGHPUT TEST: a placeholder; the throughput test sets one probe concurrency for every run of the study.
concurrency = 56

[value_free_priority]
length_exponent = 1.0
automation_log_probability = -2.8
