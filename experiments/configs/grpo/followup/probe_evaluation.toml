# Probe v2 searched with any checkpoint outside a loop (experiments/probe_evaluate.py; src/lean_search/rl/
# probe_evaluation.py): an arm's phase adapters, step-2 variants, v0. Every run of the study uses these settings, so
# runs compare; the search config may be replaced per run (--search-config).
#   python experiments/probe_evaluate.py --config experiments/configs/grpo/followup/probe_evaluation.toml \
#       --name v0 --policy-adapter /workspace/checkpoints/data_rewrite_sft_numbered/adapter --policy-version 0 --value v0
# The servers of loop_config's [serving] (deployment/grpo_loop.sh servers), its [initial] value_adapter as value v0.
loop_config = "experiments/configs/grpo/followup/base.toml"
search_config = "experiments/configs/grpo/search/visible_student_v2.toml"
probe_set = "grpo/fixed_sets/probe_v2.jsonl"
# Above this share of searches stopped on the wall clock a run is rejected: the expansions, not the clock, should be the
# budget.
max_wall_clock_stop_share = 0.05
output = "probe_evaluations"

[probe]
max_expansions = 16
# Per statement; grpo_loop_v1's 1,800 s (sized to fit a slot into a phase) stopped searches the expansions had not
# ended, and outside a loop nothing waits on the tail.
max_wall_seconds = 7200.0
# One concurrency for every run of the study (the node has half grpo_loop_v1's CPU quota).
concurrency = 32
