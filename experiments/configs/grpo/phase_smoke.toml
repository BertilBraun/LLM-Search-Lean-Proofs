# The smoke test's phase (loop_smoke.toml): phase.toml with a value gate every candidate passes, so the first phase
# also publishes a value model and exercises its merge, the value servers' swap to it and the value A/B search. Never
# for a real run. Everything else must stay as in phase.toml (tests/rl/test_shipped_grpo_configs.py).

# A search-tree GRPO phase (experiments/grpo_phase.py, DESIGN.md "Policy update: GRPO over sibling groups"). Groups
# are the policy samples of expanded proof-graph nodes; every tactic earns R = (1 - 0.15) * G + 0.15 * L from the
# state it reaches, plus delta per step of progress on the proof graph. A sample's score is its final state's R minus
# c per wasted tactic; the explanation gets the score minus the group's mean score, the block's first tactic reaching
# a state with a reward its R minus the group's mean of those R (no division by a standard deviation), later tactics
# their gain over the state before them, the closing fence 0. Every recorded sample trains on its sampled tokens at the sampling temperature, two passes per phase. The policy
# adapter is the starting policy's own SFT adapter, continued phase by phase on the weights it was trained on
# (`model`); the starting policy (`model` with `reference_adapter`) is the KL reference. The loop fills in model,
# initial_adapter (the published one) and reference_adapter from loop.toml ([serving] policy_base_model, [initial]
# policy_adapter).

[reward]
local_share = 0.15
# L of the first failing tactic (errors and timeouts) and of a sample without a usable block (e.g. a repetition loop
# cut off at the token cap).
failure_local = -1.0
# L of a tactic without progress (unchanged, back to an earlier state) or adding only redundant hypotheses: as low
# as a failure, so a no-op never beats a genuine attempt.
no_progress_local = -1.0
# L per goal a proof-graph tactic closes.
goal_closed_bonus = 0.1
# delta: a proof-graph state earns this per remaining proof-graph step it is closer to a proof than the group's node,
# so a correct further step raises the reward (and the sample's score, its final state's reward) by delta. A state
# farther from the proof loses delta per step, but its global part never falls below the best off-graph state's.
progress_per_step = 0.2
# c: the advantage of a failing, no-progress or redundant tactic after the first; the search keeps the block's valid
# prefix, so only its tokens are wasted. Tactics after the first are judged against the state before them, so
# continuing pays when P(next tactic correct) > c / (c + delta) = 1/3 if the alternative to a correct tactic is a Lean
# error; a valid step off the proof graph costs the whole drop instead (rl/README.md). Keep delta clearly above c.
wasted_tactic_cost = 0.1
# mu: expanded off-graph states earn G = mu * q; 0.15 once a value model passed the gate.
value_share = 0.0
# An expanded off-graph state with live children and fewer expanded nodes in its subtree (itself included: the
# value targets' n) is unknown like a never-expanded one, so one harvesting or epsilon expansion does not push a
# sibling down; a dead end (nothing usable from its expansion) stays off graph.
off_graph_min_expanded_nodes = 4
# Groups train only if a policy sample reaches the proof graph (the sweep's children do not count); the search
# metrics count the groups left out (graph.groups_without_policy_proof).
require_policy_proof = true

[value_targets]
# y = (1 - mu) * z + mu * q per expanded state: z the concrete label (1 with exact steps on the proof graph, 0 off
# it), q the average over its expanded descendants. mu = 0.15 once a value model passed the gate; 0 before.
value_share = 0.0
proof_graph_weight = 1.0
# Times n / (n + 4) for n expanded nodes (the state and its expanded descendants).
off_graph_weight = 0.5
half_weight_expanded_nodes = 4.0
max_targets_per_tree = 64

[ranking]
# The proof-graph child over each expanded off-graph sibling (times the sibling's n / (n + 4)) and over each
# never-expanded sibling (0: they may be provable too).
proof_over_expanded_weight = 0.5
proof_over_never_expanded_weight = 0.0
half_weight_expanded_nodes = 4.0

[policy]
model = "Qwen/Qwen3.5-4B"
initial_adapter = "/workspace/checkpoints/data_rewrite_sft_numbered/adapter"
reference_adapter = "/workspace/checkpoints/data_rewrite_sft_numbered/adapter"
sequences_per_step = 64
# Two passes if training time allows (the dashboard's training vs sampling time); 1 is allowed.
passes_per_phase = 2
warmup_steps = 5
clip_low = 0.2
clip_high = 0.28
kl_coefficient = 0.0
reference = "starting_weights"
# With kl_coefficient 0 the KL to the reference is only reported: scored on this many sequences per phase.
reference_sequences = 256
normalization_tokens = 256
replay_weight = 0.1
replay_sequences_per_step = 8
# No length filter; a recorded sample longer than the servers' context is a bug.
max_sequence_tokens = 8192

[policy.data]
# "sequence": every sampled token gets the sample's score minus the baseline (phase_sequence_credit.toml).
credit = "per_tactic"
# For records written before the sampling temperature was kept.
default_temperature = 0.8

# Unused with initial_adapter: the continued adapter keeps its own rank and alpha (the SFT stage's, from v2's).
[policy.lora]
rank = 64
alpha = 64
dropout = 0.0

[policy.optimization]
method = "lora"
learning_rate = 1e-5
minimum_learning_rate_ratio = 1.0
max_gradient_norm = 1.0
micro_batch_tokens = 16384
gradient_checkpointing = true
packing = true
compile_layers = true
seed = 0

# The loop sets the seed per phase, so each phase replays different examples.
[policy_replay]
lean_examples = 256
math_examples = 128

# The loop fills in initial_adapter (the last value adapter trained, else the published one), published_adapter (the
# one the gate compares with) and the seed (per phase: unit order and the v0 replay draw).
[value]
model = "Qwen/Qwen3.5-2B"
initial_adapter = "/workspace/checkpoints/phase3_value_v0/adapter"
published_adapter = "/workspace/checkpoints/phase3_value_v0/adapter"
retrain_from_base = false
smoothing_sigma = 0.5
bin_mass_weight = 1.0
ranking_weight = 0.5
ranking_score = "log_odds"
ranking_temperature = 1.0
max_pairs_per_tree = 64
replay_share = 0.1

[value.optimization]
method = "lora"
learning_rate = 5e-5
warmup_fraction = 0.05
minimum_learning_rate_ratio = 1.0
max_gradient_norm = 1.0
epochs = 1
micro_batch_tokens = 32768
micro_batches_per_step = 1
gradient_checkpointing = true
packing = true
compile_layers = true
seed = 0

[value.source_shares]
proof_graph = 0.4
off_graph = 0.6

# The gate: on the benchmark's labelled sibling pairs (a proof-graph child against a dead end or an explored off-graph
# sibling), the share whose proof-graph child gets the lower h, candidate minus published, resampled by problem; the
# candidate is published when the interval's lower bound lies above min_lower_bound. AUC, Brier, pair accuracy by
# p_dead and Spearman are recorded as diagnostics only.
[value.gate]
bootstrap_resamples = 5000
confidence = 0.95
seed = 0
# Below any difference of two shares: every candidate with a labelled pair passes.
min_lower_bound = -2.0
# A benchmark built from value-model-guided trees fails the gate ("warn" only reports it).
guided_trees = "refuse"
