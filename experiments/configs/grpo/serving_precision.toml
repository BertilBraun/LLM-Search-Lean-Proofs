# Serving precision (DESIGN.md "Precision", first-hour checks; deployment/README.md "Serving precision"): 200 visible
# prompts x 4 samples drawn once from the bf16-merged policy, scored by bf16-merged, fp16-merged and runtime-LoRA vLLM
# servers and by the trainer's bf16 model against an fp32 transformers reference; generation throughput per mode; and
# whether one or a few Adam steps' worth of adapter update survive each serving mode.
#   python experiments/serving_precision.py run --config experiments/configs/grpo/serving_precision.toml
name = "visible_student_v2"
# Visible student v2's adapter on raw Qwen3.5-4B (the smoke cycle's starting policy); the loop's own starting adapter
# (data_rewrite_sft_<arm>) once it exists, with --adapter and another --name.
adapter = "/workspace/checkpoints/phase5_sft_visible_student_v2/adapter"
base_model = "Qwen/Qwen3.5-4B"
states = "phase5_eval_visible_student_v2_visible/states.jsonl"
search_config = "experiments/configs/grpo/search/visible_student_v2.toml"
prompts = 200
samples_per_prompt = 4
gpus = [1, 2, 3]
first_port = 8950
modes = ["bf16_merged", "fp16_merged", "lora_bf16"]
references = ["fp32", "trainer_bf16"]
top_logprobs = 20
throughput_prompts = 64
throughput_samples = 8
throughput_max_tokens = 512
reference_micro_batch_tokens = 4096
temporary_directory = "/dev/shm/serving_precision"

# Every LoRA parameter moves by learning_rate * steps with a random sign: Adam's bias-corrected first step is
# lr * sign(gradient), and steps of a consistent sign add up. One step at the two candidate learning rates, and ten
# consistent steps at 3e-5 (a stretch of a phase, which takes ~40-80 steps).
[[perturbations]]
name = "lr1e-5_1step"
learning_rate = 1e-5
steps = 1
seed = 1

[[perturbations]]
name = "lr3e-5_1step"
learning_rate = 3e-5
steps = 1
seed = 2

[[perturbations]]
name = "lr3e-5_10steps"
learning_rate = 3e-5
steps = 10
seed = 3
