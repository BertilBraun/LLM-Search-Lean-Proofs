# Cheap test (DESIGN.md "Order of work", step 3): single-step GRPO on the 512 held-out states, per-tactic against
# sequence credit from the same starting policy (experiments/grpo_single_step.py). A tactic counts on the proof graph
# when it closes the goals or reaches a state of the state's traced proof (src/lean_search/rl/single_step.py), so every
# state's group has a known-provable anchor without a further search. Three rounds of sampling and one training phase
# (two passes, ~130 steps over ~4,000 samples) each, about a GPU-hour per arm; success measured before each round and
# after the last on the trained states and on 512 disjoint states.
#   The disjoint states, once (CPU): python experiments/phase5_reasoning_data.py states \
#       --config experiments/configs/grpo/single_step_disjoint_states.toml --run-name grpo_single_step_disjoint_states
#   Policy servers on GPUs 1-3 serving as policy-merged (deployment/README.md, "GRPO loop"; each round swaps its
#   weights in), then
#   CUDA_VISIBLE_DEVICES=0 python experiments/grpo_single_step.py --config experiments/configs/grpo/single_step.toml \
#       run --arm per_tactic        (then --arm sequence, then report)
name = "grpo_single_step"
search_config = "experiments/configs/grpo/search/visible_student_v2.toml"
# As in loop.toml: the starting policy's own adapter on the weights it was trained on, continued by each arm.
policy_base_model = "Qwen/Qwen3.5-4B"
policy_adapter = "/workspace/checkpoints/data_rewrite_sft_numbered/adapter"
train_states = "phase5_eval_visible_student_v2_visible/states.jsonl"
disjoint_states = "grpo_single_step_disjoint_states/states.jsonl"
rounds = 3
concurrency = 64
policy_server_urls = ["http://127.0.0.1:8101/v1", "http://127.0.0.1:8102/v1", "http://127.0.0.1:8103/v1"]

[[arms]]
name = "per_tactic"
phase_config = "experiments/configs/grpo/phase.toml"

[[arms]]
name = "sequence"
phase_config = "experiments/configs/grpo/phase_sequence_credit.toml"
