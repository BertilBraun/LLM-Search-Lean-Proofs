# The search-tree GRPO loop (experiments/grpo_loop.py, DESIGN.md "Next phase: search-tree GRPO"), on 4x RTX 3090:
# while sampling, every GPU serves the merged policy and the merged value model; at a phase's pause every search waits,
# the servers sleep (freeing their GPUs) and all four GPUs train data-parallel (policy GRPO, then the value model, then
# the merges), and the servers wake with the new weights. Bring-up on a fresh node:
# deployment/README.md, "GRPO loop"; the timing of each pause segment: src/lean_search/rl/README.md, "Timing".
#   python experiments/grpo_loop.py --config experiments/configs/grpo/loop.toml init
#   python experiments/grpo_loop.py --config experiments/configs/grpo/loop.toml run
name = "grpo_loop_v1"

[initial]
# The starting policy's own adapter: the SFT stage's winning arm (data_rewrite README, step 4; the named arm also needs
# [renaming] enabled and its replay data below). Version 0 is it merged into serving.policy_base_model; every phase
# continues training it on that base, so merged weights lie between bf16 grid points and small GRPO updates survive the
# rounding (a fresh adapter on already-merged weights loses most of them). It stays the KL reference.
policy_adapter = "/workspace/checkpoints/data_rewrite_sft_numbered/adapter"
value_adapter = "/workspace/checkpoints/phase3_value_v0/adapter"

[serving]
# Per GPU 0.62 + 0.28 of its memory: the servers leave nothing for training, which runs while they sleep.
# The weights the starting policy's adapter was trained on (the SFT stage continues visible student v2 on the base).
policy_base_model = "Qwen/Qwen3.5-4B"
value_base_model = "Qwen/Qwen3.5-2B"
policy_model = "policy-merged"
value_model = "value-merged"

[[serving.policy_servers]]
name = "policy-gpu0"
gpu = 0
url = "http://127.0.0.1:8100/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu1"
gpu = 1
url = "http://127.0.0.1:8101/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu2"
gpu = 2
url = "http://127.0.0.1:8102/v1"
memory_share = 0.62

[[serving.policy_servers]]
name = "policy-gpu3"
gpu = 3
url = "http://127.0.0.1:8103/v1"
memory_share = 0.62

[[serving.value_servers]]
name = "value-gpu0"
gpu = 0
url = "http://127.0.0.1:8200/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu1"
gpu = 1
url = "http://127.0.0.1:8201/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu2"
gpu = 2
url = "http://127.0.0.1:8202/v1"
memory_share = 0.28
max_num_seqs = 96

[[serving.value_servers]]
name = "value-gpu3"
gpu = 3
url = "http://127.0.0.1:8203/v1"
memory_share = 0.28
max_num_seqs = 96

[sampling]
# n = 8, harvesting and ε on, heartbeat limits, flattening; server URLs come from [serving].
search_config = "experiments/configs/grpo/search/visible_student_v2.toml"
# Expansions per training search (the shared template's 64 stays for other uses; the probe searches at 16, miniF2F at
# 64). Harvesting adds up to 16 after the first proof. In the visible run expansions 17-64 added 8 of 171 solves. The
# Training page's budget signals show whether 32 cuts off harder proofs (solves crowding into expansions 25-32; the
# loop notes it in loop.log above [health] max_late_solve_share); to raise it, edit this and restart the loop.
max_expansions = 32
# One REPL per search; most searches wait on the GPUs. Tune by the first hour (Lean cores and memory on the
# dashboard's system page; a REPL holds 0.25-2 GiB of private memory; budget in src/lean_search/rl/README.md).
concurrency = 112
# While the probe or miniF2F runs beside sampling, or the held-out states' last Lean checks after the early resume,
# the searches taking statements fill what its searches in flight leave of the 112 (at least 56): 56 + 56 at its start,
# back toward 112 as its tail shrinks. Searches the pause held all continue at the held-out resume, so the peak there is
# up to 112 + the held-out states still in Lean (about 110).
min_concurrency_beside_evaluations = 56
status_seconds = 30.0
# A search a policy or value server failed feeds its statement again, up to this many times.
server_failure_retries = 3
server_failure_pause_seconds = 5.0

# Search options A/B (rl/README.md): statements with an odd sha256(name) search with the feedback round, the others as
# the template. Owner decision 2026-10-30, after review P: looks after A/B phases 2, 4 and 6 on R (solves per generated
# token, feedback over control) with the groups-per-token guard (rl/options_ab.py; loop.log "Search options A/B
# (feedback) look <k>"); after `max_phases` the arm switches off by itself. Ended after 3 phases (6-8), 2026-10-31: look
# 2 R 0.81 (95% [0.68, 0.97]), groups per token 0.84 (guard 0.95 failed), phase 8 alone -0.0043 solves per 1k tokens
# [-0.0081, -0.0008]; look 4's futility bound (upper 95% < 1.05) already met.
[sampling.options_arm]
name = "feedback"
max_phases = 3

[sampling.options_arm.options.feedback]
enabled = true
min_children = 2
max_attempts = 2
sample_count = 4

[training]
phase_config = "experiments/configs/grpo/phase.toml"
# One torchrun rank per GPU; each optimizer step equals the one-GPU step. Fallback if the pause costs too much: [0]
# (GPU 0 trains alone, its servers sleep, the other GPUs' servers stay loaded and idle).
gpus = [0, 1, 2, 3]
# A phase ends once it has 300 trainable groups (proof-graph nodes of solved trees with a policy proof and a non-zero
# advantage, counted as each tree finishes), after at least 75 and at most 120 min of sampling: the pause's fixed costs
# (start, loads, compile, merges, wake) are paid per phase (review F, M4). The groups always pass 300 long before
# (1368 and 1881 in phases 1-2 at 45 min), so the minutes set the phase: one pass over ~2,500 groups, ~25 min of
# training per ~75 min of sampling (owner, 2026-10-30). An evaluation beside sampling holds a due pause up to
# [evaluation] max_pause_wait_minutes.
min_sampling_minutes = 75.0
max_sampling_minutes = 120.0
min_trainable_groups = 300
check_seconds = 30.0
# A job's first phase of a kind (model building, compilation, and with a value phase the first value training) gets 2
# h: phase 2 (1881 groups, then 2 passes) would have passed 45 min.
first_train_timeout_minutes = 120.0
# The value model every 2 phases on the last 4 phases' trees (with 45-90-minute phases a retrain every 1.5-3 h on 3-6 h
# of trees), continuing the last value adapter trained; every one is published and searched with, the evaluations'
# too (no gate; the value benchmark is a trend on the dashboard). The persistent trainer labels the window while the
# value phase samples. μ is 0 until set by hand: deployment/grpo_loop.sh value-share 0.15 (read when each phase starts
# training).
value_every_phases = 2
value_window_phases = 4
# Under $LEAN_SEARCH_DATA: the starting policy's SFT data, flat proofs without nested `have ... := by` (data_rewrite.py
# build, data_rewrite README step 3, of the same arm as [initial]) and its math solutions (phase.toml [policy_replay]).
lean_replay = "reasoning/visible_student_v3_numbered/train.jsonl"
math_replay = "reasoning/visible_student_v3_numbered/math.jsonl"
# v0's own training data (phase3_value_data.py --name v0; node_backup generated_data: data/value/v0/), replayed as
# 10% of the value targets.
value_replay = "value/v0/train.jsonl"
# Before the training job starts, the paused searches' REPL processes above this private memory stop (0: all), so the
# four ranks' parsed trees fit next to the sleeping servers; they replay their proof states on the next request.
# Memory budget: src/lean_search/rl/README.md, "Host memory".
paused_repl_memory_gib = 0.0
# One training job for the whole loop, its models parked in host memory between phases and its merges handed to the
# servers in memory (rl/README.md, "Persistent trainer"); false: grpo_phase.py per phase. The host directory needs
# ~28 GiB of tmpfs (rent with --shm-size 32g or more).
persistent = true
host_directory = "/dev/shm/lean_search"

[statements]
kind = "curriculum"
held_out = ["grpo/fixed_sets/probe.jsonl", "grpo/fixed_sets/gate.jsonl"]

[statements.curriculum]
verified = "expert_iteration/pool_v3/verified.jsonl"
# Verified statements only: the curriculum's statements are certified provable.
unverified = ""
proof_steps_weight = 0.5
root_value_weight = 0.5
band_width = 1.0
band_step = 0.5
# Each band is judged on the first 50 statements fed at it (not the first 50 to finish), once 45 finished, the 5
# still running counted unsolved: the slowest searches (p98 38 min, max 56) held a cohort past a phase and its pause,
# and a restart starts a new cohort, so the band never moved in phases 1-3.
window = 50
judged_share = 0.9
raise_solve_rate = 0.5
fast_raise_solve_rate = 0.8
fast_band_step = 1.5
lower_solve_rate = 0.3
seed = "grpo-curriculum"

[evaluation]
probe_set = "grpo/fixed_sets/probe.jsonl"
# The probe and miniF2F search with the published value model, so they measure policy and value together (the value
# benchmark is the value model's own trend; an alert when a value model's interval lies below v0's), and run beside
# sampling after the pause: nothing swaps, and the searches fill the GPUs their Lean-bound tails leave. A failure is an
# alert and runs again after the next pause. The held-out states stay at the pause (the health checks read them).
value_model = "published"
beside_sampling = true
# A phase due while they run waits at most this long, then cancels them (they run again after the pause).
max_pause_wait_minutes = 30.0
held_out_states_file = "phase5_eval_visible_student_v2_visible/states.jsonl"
# Before evaluating at the pause, the paused searches' REPL processes above this private memory stop (0: all); they
# restart and replay their proof states on the next request. Memory budget: src/lean_search/rl/README.md, "Host memory".
paused_repl_memory_gib = 0.0

# One part of the probe set per slot, the parts in turn (a stratified third, ~167 problems): every ~2 hours of loop
# time (sampling and training), so the whole set every ~6 hours; the dashboard draws each slot against version 0's runs
# of the same third, the last three together, and the raw rates. Before sampling starts, version 0's baselines run
# all at once, each run its own job sharing 112 REPLs (baseline_concurrency: 6 x 11 probe runs, 40 miniF2F, 6 held-out
# states, by their estimated work): every part twice (the run-to-run noise), miniF2F and the held-out states. Later the
# probe and miniF2F run 56 REPLs beside sampling; the held-out states 112 at the pause, the paused searches' REPLs
# stopped first.
probe_parts = 3

[evaluation.probe]
max_expansions = 16
# In the naming A/B's numbered probe (501 problems, 16 expansions) p90 16 min, p99 38 min, no solve after 30 min
# (~3% stop on the cap). 30 min keeps a slot (~50 min at 56) within a phase plus the pause's 30-min wait: a slot cut
# off at the pause starts over at the next version.
max_wall_seconds = 1800.0
concurrency = 56
every_hours = 2.0
at_start = true
baseline_runs = 2
baseline_concurrency = 11

# Off: the probe already searches with the published value model. With value_model = "initial", once per published
# value model other than v0 the first probe slot after its publish would search its part again with it, paired per
# problem with the slot's run with v0 (an alert when worse at `significance`).
[evaluation.value_arm]
enabled = false
confidence = 0.95
significance = 0.05

# grpo_fixed_sets.py gate-benchmark (the gate set searched once without a value model), under $LEAN_SEARCH_RUNS: every
# newly served value model scores it through the value servers while the searches run, a trend against v0 and the value
# model before it (share of labelled sibling pairs ordered by h with a paired cluster bootstrap over problems; AUC,
# Brier, calibration, Spearman of the steps).
[evaluation.value_benchmark]
path = "grpo_gate/benchmark.json.gz"

# Version 0's baseline before sampling (version 0's merged weights are never pruned), then milestones only, beside
# sampling: grpo_loop.py request-evaluation --target minif2f (or grpo_evaluate.py with the loop stopped).
[evaluation.minif2f]
max_expansions = 64
max_wall_seconds = 3600.0
concurrency = 56
every_hours = 0.0
at_start = true
baseline_concurrency = 40

# Per-sample success and valid Lean on the 512 held-out states with every probe slot (~2 hours, a few minutes each): the
# hard stop's signal. Version 0's run before sampling is its reference; the loop refuses to start without it.
[evaluation.held_out_states]
max_expansions = 1
# One slow Lean check held phase 2's pause ~5 min with idle GPUs (version 0's run stopped no state at 600 s); the
# searches now resume once every state is sampled, beside the last Lean checks.
max_wall_seconds = 120.0
concurrency = 112
every_hours = 2.0
at_start = true
baseline_concurrency = 6

# After each publish, the phase adapters of versions older than the last 5 are deleted unless still used (the current
# version's, the value adapter the next value training continues, the policy adapters of the last 3 versions whose
# held-out evaluation raised no alert: the rollback targets); 0 keeps every adapter. src/lean_search/rl/README.md,
# "Disk".
[retention]
adapter_versions = 5
healthy_versions = 3

# Per-phase health checks (src/lean_search/rl/README.md, "Health checks"): alerts in loop.log and on the dashboard's
# Training page. First guesses, to be calibrated on the first phases (relative limits use the mean of the first
# `reference_phases` phases or version 0's held-out evaluation).
[health]
reference_phases = 2
# k1's mean per token over the last pass's 256 reference sequences (the first round's), an unbiased KL that no single
# token dominates. The loop's KL keeps growing phase by phase: 0.5 nats per token flags a policy far from its start.
max_kl_to_starting_policy = 0.5
max_clip_fraction = 0.1
min_distinct_samples_fraction = 0.75
min_explanation_fraction = 0.5
max_explanation_fraction = 2.0
max_cut_off_factor = 2.0
min_cut_off_rise = 0.01
min_held_out_valid_fraction = 0.9
min_held_out_success_fraction = 0.9
# A collapse: below 0.7 of version 0's held-out valid-Lean rate the loop publishes the last healthy version's policy
# again (an alert in loop.log and on the dashboard) and keeps sampling; a second collapse within 4 phases of that
# rollback stops the loop (health_stop.json; grpo_loop.py rollback or clear-health-stop, then loop again). 0 never acts;
# rollback_window_phases = 0 stops at the first collapse.
stop_held_out_valid_fraction = 0.7
rollback_window_phases = 4
# The sampled blocks' valid-Lean rate per phase (free, from the training trees) below 0.85 of the first phases': the
# held-out states run at the next pause.
min_valid_block_fraction = 0.85
# A note suggesting a larger [sampling] max_expansions once more than 10% of the last 3 phases' solves came in the
# budget's last quarter.
max_late_solve_share = 0.10
late_solve_phases = 3

# On only when the starting policy is the naming A/B's named arm (grpo_fixed_sets.py rename first).
[renaming]
enabled = false
renamings = ["grpo/renamings.jsonl"]
