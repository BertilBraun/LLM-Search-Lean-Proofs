# Ablation-ladder row 3, list length 0: row 2 (automation sweep, then the policy; best-first on the
# cumulative log-probability; same budget) with the lemma-aware adapter `policy-lemmas` (phase4_sft.py), which
# saw lists of length 0-32 in training, so every arm uses the same adapter. Run on the 64 problems of
# experiments/configs/retrieval/phase4_subset.txt.
# Length 0: no retrieval and no applicability check; the prompt is the plain row-2 prompt.

[lean]
pool_size = 40
concurrency = 40

[search]
max_expansions = 64
max_wall_seconds = 600.0
max_depth = 16
tactic_timeout_seconds = 10.0
forbidden_steps = [
    "exact?",
    "apply?",
    "rw?",
    "simp?",
    "simp_all?",
    "dsimp?",
    "aesop?",
    "hint",
    "rw_search",
    "library_search",
]

[expander]
kind = "automation_then_policy"

[automation]
tactics = [
    "decide",
    "omega",
    "intros",
    "constructor",
    "rfl",
    "simp",
    "field_simp",
    "norm_num",
    "linarith",
    "ring_nf",
    "simp_all",
    "nlinarith",
    "aesop",
]
timeout_seconds = 10.0
max_wall_clock_timeouts_per_tactic = 1

[priority]
kind = "cumulative_log_probability"
length_exponent = 1.0
# Median log-probability of the SFT v1 probe samples that made progress (-2.39; row 1 used the same rule).
automation_log_probability = -2.4

[policy]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
adapter = "policy-lemmas"
sample_count = 16
temperature = 0.8
top_p = 1.0
# SFT completions were capped at 256 tokens; SFT samples average ~26 tokens, so the cap rarely binds.
max_tokens = 256
thinking = false
few_shot = false
