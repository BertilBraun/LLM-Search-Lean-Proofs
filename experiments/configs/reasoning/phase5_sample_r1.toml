# Phase 5 round 1: single-step on-policy reasoning (experiments/phase5_reasoning_data.py). Per traced train-split
# state, k thinking samples from the SFT v2 policy adapter; every distinct block runs on the rebuilt state in Lean and
# succeeds if it applies whole and closes the goals or reaches a state of the reference proof. Two vLLM servers (one
# per RTX 3090) serve the raw base with the adapter:
#   deployment/serve_model.sh search-qwen3.5-2b Qwen/Qwen3.5-2B 0 8100 \
#       --lora-modules policy-v2=/workspace/checkpoints/phase2_sft_v2/adapter   (and GPU 1, port 8101)

[states]
count = 6000
states_per_proof = 2
max_goal_characters = 3000
seed = "reasoning"
# Marks states whose goals are SFT v2 prompts (statistics by SFT exposure); they are not avoided.
seen_sft_data = ["v2"]
# The pilot's states stay held out for the before/after comparison (phase5_eval_r1_*.toml).
excluded_runs = ["phase5_pilot_sft_v2_thinking"]

[policy]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
adapter = "policy-v2"
sample_count = 8
# The search's sampling temperature, so the reasoning is learned on the distribution the search draws from.
temperature = 0.8
top_p = 1.0
# Reasoning and block together, so reasoning is rarely cut off; truncated samples are failures. Selection still
# prefers the shortest successful reasoning of a state.
max_tokens = 2048
thinking = true
few_shot = false
request_timeout_seconds = 1800.0

[execution]
pool_size = 16
tactic_timeout_seconds = 10.0
foreign_header_batch_size = 16

[pipeline]
chunk_states = 256
requests_in_flight = 128

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0
