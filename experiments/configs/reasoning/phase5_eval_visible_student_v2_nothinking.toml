# Visible-reasoning student v2, evaluation arm: no thinking, cap 256.
# The bootstrap evaluation's 512 traced validation states
# (`states --states-from phase5_eval_bootstrap_sft_v2_thinking`), k = 8, temperature 0.8. Both servers serve the
# merged student as visible-student:
#   deployment/serve_model.sh visible-student-gpu<gpu> \
#       /workspace/checkpoints/phase5_sft_visible_student_v2/merged <gpu> 810<gpu> \
#       --served-model-name visible-student --no-enable-lora

[states]
count = 512
states_per_proof = 2
max_goal_characters = 3000
seed = "bootstrap-eval"
seen_sft_data = ["v2", "4b"]
unseen_only = true
# The deferred Goedel SFT v2 tracing is in the shards, not in the snapshot SFT v2 was built from.
traced = "shards"
# The sources whose unseen states are not biased: the other sources' few unseen states are mostly those whose
# reference step SFT dropped as too long.
sources = ["goedel_sft_v2", "stp_lean_workbook"]
excluded_runs = []
split = "validation"

[policy]
model = "visible-student"
tokenizer = "Qwen/Qwen3.5-4B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
sample_count = 8
temperature = 0.8
top_p = 1.0
max_tokens = 256
thinking = false
few_shot = false
request_timeout_seconds = 1800.0

[execution]
pool_size = 16
tactic_timeout_seconds = 10.0
foreign_header_batch_size = 16

[pipeline]
chunk_states = 128
requests_in_flight = 128

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0
