# Visible-reasoning student v2 data (phase5_reasoning_data.py select --name visible_student_v2): the visible
# successes of the 9B teacher and of the gentle-SFT 4B as in v1, but explanations under 40 tokens (mostly the 4B's
# own, median 33) capped at 20% of the reasoning examples, the teacher's kept first; 10% thinking-format teacher
# traces of round 2 (`teacher_9b_light`) so the think block keeps working; replay of Lean steps (`4b`) and of the
# gentle SFT v2's own math solutions (`self_v1`) instead of the terse reference solutions of `math_v1`.
runs = ["phase5_visible_teacher_9b", "phase5_visible_self_4b"]
replay_data = "4b"
replay_ratio = 0.2143
math_replay_data = "self_v1"
math_replay_ratio = 0.2143
short_reasoning_tokens = 40
max_short_share = 0.2
extra_reasoning_data = "teacher_9b_light"
extra_reasoning_ratio = 0.1
validation_fraction = 0.03
validation_replay_examples = 500
tokenizer = "Qwen/Qwen3.5-4B"
seed = "visible-student-v2"
max_kept_reasoning_tokens = 350
shortening = "9b_light"

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0
