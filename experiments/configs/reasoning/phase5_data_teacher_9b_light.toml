# Second student round's data (phase5_reasoning_data.py select --name teacher_9b_light): per state at most two
# teacher successes with at most 350 reasoning tokens as sampled, or with a sufficient light compression to about
# half the length (shortening `9b_light`, phase5_shortening_9b_light.toml),
# and as many non-thinking replay examples from the student's own SFT data `4b` (the owner's 50/50 mix; no SFT
# example the student has not seen). The examples use the plain thinking prompt: the teacher's brevity instruction
# is not part of the student's prompt.
runs = ["phase5_teacher_9b"]
replay_data = "4b"
replay_ratio = 1.0
validation_fraction = 0.03
validation_replay_examples = 500
tokenizer = "Qwen/Qwen3.5-4B"
seed = "teacher-9b-light"
max_kept_reasoning_tokens = 350
shortening = "9b_light"
thinking_instruction = ""

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0
