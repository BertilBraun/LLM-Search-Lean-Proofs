# The 4B fallback rewriter for the bootstrap's shortening (`shorten --shortening-config` this file `--name 4b`):
# Qwen3.5-4B without thinking on its own server, e.g. GPU 0 after stopping that GPU's 2B server:
#   deployment/serve_model.sh rewrite-4b Qwen/Qwen3.5-4B 0 8102 --served-model-name rewrite-qwen3.5-4b
# The sufficiency check samples the SFT v2 policy on the other GPU's 2B server.

max_kept_reasoning_tokens = 256
candidates_per_state = 3
# Optional: a run of the SFT v2 policy without thinking on the same states (phase5_bootstrap_r1_nothinking.toml),
# whose successful steps get a rationalization where thinking found nothing.
rationalize_runs = []

[rewrite]
model = "rewrite-qwen3.5-4b"
tokenizer = "Qwen/Qwen3.5-4B"
server_urls = ["http://127.0.0.1:8102/v1"]
target_tokens = 150
max_accepted_tokens = 200
max_tokens = 320
candidates = 2
temperature = 0.7
top_p = 1.0

[sufficiency]
server_urls = ["http://127.0.0.1:8101/v1"]
sample_count = 4
temperature = 0.8
top_p = 1.0
max_tokens = 256
