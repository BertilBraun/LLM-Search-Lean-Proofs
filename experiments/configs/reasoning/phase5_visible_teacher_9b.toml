# Visible-reasoning series, step 2: Qwen3.5-9B (post-trained, no adapter) in visible mode (thinking off, a short
# explanation and then the lean block) on SFT-unseen traced train states that rounds 1-2 did not use, k = 8, cap 1024.
# Successes over 350 explanation tokens are condensed by the 9B to about half (`shorten --name 9b_light`, the round-2
# rules) and kept only if the 9B, given the condensed explanation before the block, still writes a successful step.
#   MAX_MODEL_LEN=5120 GPU_MEMORY_UTILIZATION=0.95 deployment/serve_model.sh teacher-9b-gpu<gpu> Qwen/Qwen3.5-9B <gpu> \
#       811<gpu> --served-model-name teacher-9b --no-enable-lora --max-num-seqs 64

[states]
count = 6144
states_per_proof = 2
max_goal_characters = 3000
seed = "visible-teacher"
# The 4B student's SFT data (and the gentle SFT's, the same Lean data) and SFT v2's.
seen_sft_data = ["v2", "4b"]
unseen_only = true
traced = "shards"
sources = ["goedel_sft_v2", "stp_lean_workbook"]
# Rounds 1-2 drew from the bootstrap's pool; their states are excluded.
excluded_runs = ["phase5_bootstrap_r1", "phase5_teacher_9b"]

[policy]
model = "teacher-9b"
tokenizer = "Qwen/Qwen3.5-9B"
server_urls = ["http://127.0.0.1:8110/v1", "http://127.0.0.1:8111/v1"]
sample_count = 8
temperature = 0.8
top_p = 1.0
max_tokens = 1024
thinking = false
visible_reasoning = true
few_shot = false
# Forced samples are recorded but never selected for training (their explanation is cut off).
force_answer_on_truncation = true
forced_answer_tokens = 256
request_timeout_seconds = 1800.0

[execution]
pool_size = 16
tactic_timeout_seconds = 10.0
foreign_header_batch_size = 16

[pipeline]
chunk_states = 256
requests_in_flight = 128

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0

[shortening]
max_kept_reasoning_tokens = 350
candidates_per_state = 3
rationalize_runs = []

[shortening.rewrite]
model = "teacher-9b"
tokenizer = "Qwen/Qwen3.5-9B"
server_urls = ["http://127.0.0.1:8110/v1", "http://127.0.0.1:8111/v1"]
target_tokens = 150
target_ratio = 0.5
min_accepted_tokens = 100
min_accepted_ratio = 0.3
max_accepted_ratio = 0.8
max_accepted_tokens = 700
max_tokens = 800
candidates = 2
temperature = 0.7
top_p = 1.0

[shortening.sufficiency]
sample_count = 4
temperature = 0.8
top_p = 1.0
max_tokens = 256
