# Phase 5 pilot, arm (b): arm (a) (phase5_pilot_sft_v2_thinking.toml) with policy.thinking_instruction set to the
# brevity instruction (policy.prompts.BRIEF_THINKING_INSTRUCTION). Same states:
# `states --states-from phase5_pilot_sft_v2_thinking`.

[states]
count = 512
states_per_proof = 2
max_goal_characters = 3000
seed = "reasoning"
# Marks states whose goals are SFT v2 prompts (statistics by SFT exposure); they are not avoided.
seen_sft_data = ["v2"]
excluded_runs = []

[policy]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8101/v1"]
adapter = "policy-v2"
sample_count = 8
# The search's sampling temperature, so the reasoning is learned on the distribution the search draws from.
temperature = 0.8
top_p = 1.0
# Reasoning and block together; truncated samples are failures, so the cap is the reasoning length the search pays.
max_tokens = 1024
thinking = true
thinking_instruction = "Think briefly (a few sentences) about which tactic to use; do not restate the goal."
few_shot = false
request_timeout_seconds = 1800.0

[execution]
pool_size = 16
tactic_timeout_seconds = 10.0
foreign_header_batch_size = 16

[pipeline]
chunk_states = 128
requests_in_flight = 128

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0
