# Phase 5 evaluation after round 1, thinking: the round-1 reasoning adapter on the pilot's held-out states
# (`states --states-from phase5_pilot_sft_v2_thinking`), at the training cap (2048); the statistics simulate the
# smaller caps. Compare with the pilot arm (a) (results/phase5_pilot/README.md); SFT-seen and unseen states apart.
# Both servers serve the base with the adapters policy-v2 and reasoning-r1 (/workspace/checkpoints/phase5_sft_r1/adapter).

[states]
count = 512
states_per_proof = 2
max_goal_characters = 3000
seed = "reasoning"
# Marks states whose goals are SFT v2 prompts (statistics by SFT exposure); they are not avoided.
seen_sft_data = ["v2"]
excluded_runs = []

[policy]
model = "search-qwen3.5-2b"
tokenizer = "Qwen/Qwen3.5-2B"
server_urls = ["http://127.0.0.1:8100/v1", "http://127.0.0.1:8101/v1"]
adapter = "reasoning-r1"
sample_count = 8
# The search's sampling temperature, so the reasoning is learned on the distribution the search draws from.
temperature = 0.8
top_p = 1.0
# Reasoning and block together; truncated samples are failures, so the cap is the reasoning length the search pays.
max_tokens = 2048
thinking = true
few_shot = false
request_timeout_seconds = 1800.0

[execution]
pool_size = 16
tactic_timeout_seconds = 10.0
foreign_header_batch_size = 16

[pipeline]
chunk_states = 128
requests_in_flight = 128

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0
