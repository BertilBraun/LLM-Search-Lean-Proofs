# Phase 5 round-1 reasoning SFT data (experiments/phase5_reasoning_data.py select --name r1): rejection sampling
# over phase5_sample_r1's records, mixed one-to-one with non-thinking replay from the SFT v2 data.
runs = ["phase5_sample_r1"]
replay_data = "v2"
replay_ratio = 1.0
validation_fraction = 0.03
validation_replay_examples = 500
tokenizer = "Qwen/Qwen3.5-2B"
seed = "reasoning-data-r1"

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0
