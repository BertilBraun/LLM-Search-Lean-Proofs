# Qwen/Qwen3.5-9B, post-trained, no adapter, bf16 on one RTX 3090 with a shorter context:
#   MAX_MODEL_LEN=5120 GPU_MEMORY_UTILIZATION=0.95 deployment/serve_model.sh probe-9b Qwen/Qwen3.5-9B 0 8110 \
#       --no-enable-lora
# Model-size probe (results/phase5_model_size_probe/): zero-shot thinking on the bootstrap evaluation's 512 unseen
# validation states (`states --states-from phase5_eval_bootstrap_sft_v2_thinking`), k=8, temperature 0.8, cap 4096,
# the reasoning pipeline's success metric. Each model has its own server (one per GPU); 64-state chunks so that a
# wall-time cap keeps the finished chunks.

[states]
count = 512
states_per_proof = 2
max_goal_characters = 3000
seed = "bootstrap-eval"
seen_sft_data = ["v2"]
unseen_only = true
# The deferred Goedel SFT v2 tracing is in the shards, not in the snapshot SFT v2 was built from.
traced = "shards"
# The sources whose unseen states are not biased: the other sources' few unseen states are mostly those whose
# reference step SFT dropped as too long.
sources = ["goedel_sft_v2", "stp_lean_workbook"]
excluded_runs = []
split = "validation"

[policy]
model = "probe-9b"
tokenizer = "Qwen/Qwen3.5-9B"
server_urls = ["http://127.0.0.1:8110/v1"]
sample_count = 8
temperature = 0.8
top_p = 1.0
max_tokens = 4096
thinking = true
few_shot = false
request_timeout_seconds = 1800.0

[execution]
pool_size = 8
tactic_timeout_seconds = 10.0
foreign_header_batch_size = 16

[pipeline]
chunk_states = 64
requests_in_flight = 128

[reward]
accept_later_reference_states = true
value_progress = false
value_progress_margin = 1.0

[selection]
max_per_state = 2
min_reasoning_tokens = 16
max_reasoning_tokens = 0
