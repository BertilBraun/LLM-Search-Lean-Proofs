[project]
name = "lean-search"
version = "0.1.0"
description = "LLM-guided best-first proof search in Lean 4"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ml = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_search"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
