; The offline arm's driver (deployment/offline_chain.sh) under the node's supervisord: an exit 0 (HOLD, STOPPED) is final,
; any other exit is retried. Installed as /etc/supervisor/conf.d/offline_chain.conf; the command is the driver's copy,
; with chain_helpers.sh beside it. Create /workspace/runs/offline_chain before installing (the log lives there).
[program:offline_chain]
command=/workspace/step1_chain_tools/offline_chain.sh
environment=HOME="/root"
autostart=true
autorestart=unexpected
exitcodes=0
; 0: a start that exits 0 at once (HOLD or STOPPED present) is final; with startsecs > 0 supervisord counts any exit
; within it, exit 0 included, as a failed start and retries it startretries times.
startsecs=0
startretries=1000
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/workspace/runs/offline_chain/supervisor.log
redirect_stderr=true
stdout_logfile_maxbytes=10MB
